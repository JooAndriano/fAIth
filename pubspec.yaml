name: faith_mobile
description: "fAIth - Personal AI Spiritual Companion mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  cupertino_icons: ^1.0.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.17.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/splash_logo.png

# Generate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/icon_monochrome.png
  # The art already has padding; a smaller inset keeps the book as large as in icon.png
  # while staying inside the 66dp safe zone.
  adaptive_icon_foreground_inset: 8

# Generate with: dart run flutter_native_splash:create
# Keep colors and logo size in sync with lib/features/splash (SplashPage).
flutter_native_splash:
  color: '#C9A961'
  image: assets/branding/splash_logo.png
  android_12:
    color: '#C9A961'
    image: assets/branding/splash_android12.png
    icon_background_color: '#C9A961'
  fullscreen: false
  android: true
  ios: true
  web: false
